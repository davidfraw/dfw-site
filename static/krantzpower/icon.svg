<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#1F5CB8"/>
  <!-- barbell -->
  <rect x="10" y="24" width="80" height="5" rx="2.5" fill="#ECEFF3"/>
  <rect x="13" y="15" width="8" height="23" rx="2.5" fill="#ECEFF3"/>
  <rect x="22" y="18" width="5" height="17" rx="2" fill="#ECEFF3"/>
  <rect x="79" y="15" width="8" height="23" rx="2.5" fill="#ECEFF3"/>
  <rect x="73" y="18" width="5" height="17" rx="2" fill="#ECEFF3"/>
  <!-- arms up to the bar -->
  <path d="M38 62 C30 54 30 38 33 30" stroke="#0B0B0F" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M62 62 C70 54 70 38 67 30" stroke="#0B0B0F" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="33" cy="29" r="5" fill="#0B0B0F"/>
  <circle cx="67" cy="29" r="5" fill="#0B0B0F"/>
  <!-- body -->
  <ellipse cx="50" cy="96" rx="27" ry="30" fill="#0B0B0F"/>
  <!-- head -->
  <path d="M30 48 L34 36 L45 44 L55 44 L66 36 L70 48 Z" fill="#0B0B0F"/>
  <path d="M35.5 40 L38 44 L42 43 Z" fill="#E9A0B4"/>
  <path d="M64.5 40 L62 44 L58 43 Z" fill="#E9A0B4"/>
  <ellipse cx="50" cy="60" rx="21" ry="18" fill="#0B0B0F"/>
  <!-- eyes -->
  <ellipse cx="42" cy="59" rx="5" ry="4.6" fill="#F4C84A"/>
  <ellipse cx="58" cy="59" rx="5" ry="4.6" fill="#F4C84A"/>
  <ellipse cx="42" cy="59" rx="1.5" ry="4" fill="#0B0B0F"/>
  <ellipse cx="58" cy="59" rx="1.5" ry="4" fill="#0B0B0F"/>
  <!-- nose and whiskers -->
  <path d="M48 66 L52 66 L50 69 Z" fill="#E9A0B4"/>
  <path d="M30 64 L41 67 M30 70 L41 69 M70 64 L59 67 M70 70 L59 69" stroke="#ECEFF3" stroke-width="1.3" stroke-linecap="round"/>
</svg>
